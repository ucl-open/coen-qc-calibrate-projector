[project]
name = "coen-qc-calibrate-projector"
description = "The projector calibration's environment: the lab's open-rigs, whose Bonsai setup .bonsai\\Setup.ps1 runs."
license = "MIT"
requires-python = ">=3.11, <3.12"
version = "0.1.0"
dependencies = [
  "open-rigs",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "ee00d6879202013ac90d986d5f9f1cd8aea8eb61"}
